name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  python:
    name: Python package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/django-stack
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - name: Lint the backend template
        working-directory: templates/backend
        run: uv run --project ../../python/django-stack ruff check . && uv run --project ../../python/django-stack ruff format --check .

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build

  e2e:
    name: End-to-end (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Development with the local S3 service.
          - profile: dev
            script: scripts/e2e.sh
            project: e2e-site
          # Production images behind Caddy, media on disk, backups.
          - profile: prod
            script: scripts/e2e-prod.sh
            project: prod-site
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Resolve site.localhost
        run: echo "127.0.0.1 site.localhost" | sudo tee -a /etc/hosts
      - run: ${{ matrix.script }} "$RUNNER_TEMP"
        env:
          LOCAL_S3: ${{ matrix.profile == 'dev' && '1' || '' }}
      - name: Logs
        if: failure()
        run: docker compose --project-directory "$RUNNER_TEMP/${{ matrix.project }}" logs --tail 200