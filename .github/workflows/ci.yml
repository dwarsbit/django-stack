name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  python:
    name: Python package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/django-stack
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - name: Lint the backend template
        working-directory: templates/backend
        run: uv run --project ../../python/django-stack ruff check . && uv run --project ../../python/django-stack ruff format --check .

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build

  e2e:
    name: End-to-end (${{ matrix.frontend }}, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every frontend passes the same tests, on every change; headless
        # the ones of the API and the admin.
        frontend: [astro, next, sveltekit, nuxt, headless, templates]
        profile: [dev, prod]
        include:
          # Development with the local S3 service.
          - profile: dev
            script: scripts/e2e.sh
            project: e2e-site
          # Production images behind Caddy, media on disk, backups.
          - profile: prod
            script: scripts/e2e-prod.sh
            project: prod-site
          # The cache and the task queue in Valkey instead of Postgres.
          - frontend: astro
            profile: dev-valkey
            script: scripts/e2e.sh
            project: e2e-site
            cache: valkey
          # The frontend installed with npm and with Bun instead of pnpm,
          # in production images.
          - frontend: nuxt
            profile: prod-npm
            script: scripts/e2e-prod.sh
            project: prod-site
            package-manager: npm
          - frontend: sveltekit
            profile: prod-bun
            script: scripts/e2e-prod.sh
            project: prod-site
            package-manager: bun
          # Postgres 18 with its client in the backend image, and a
          # backup with a restore.
          - frontend: astro
            profile: prod-postgres18
            script: scripts/e2e-prod.sh
            project: prod-site
            postgres: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Resolve site.localhost
        run: echo "127.0.0.1 site.localhost" | sudo tee -a /etc/hosts
      - run: ${{ matrix.script }} "$RUNNER_TEMP"
        env:
          FRONTEND: ${{ matrix.frontend }}
          LOCAL_S3: ${{ matrix.profile == 'dev' && '1' || '' }}
          CACHE: ${{ matrix.cache || '' }}
          PACKAGE_MANAGER: ${{ matrix.package-manager || '' }}
          POSTGRES: ${{ matrix.postgres || '' }}
      - name: Logs
        if: failure()
        run: docker compose --project-directory "$RUNNER_TEMP/${{ matrix.project }}" logs --tail 200