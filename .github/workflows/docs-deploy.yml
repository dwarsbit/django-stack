name: Deploy docs

# Publishes website/ to GitHub Pages at https://djangostack.org/.
# Needs Settings > Pages > Source set to "GitHub Actions" and the custom
# domain djangostack.org (website/static/CNAME).

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "pnpm-lock.yaml"
      # The site shows the CLI's version.
      - "packages/cli/package.json"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history, for the "last updated" date on each page.
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
