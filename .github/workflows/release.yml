name: Release

# npm: Changesets opens a "Version packages" pull request; merging it
# publishes the packages with provenance.
# PyPI: pushing a tag python-v<version> publishes django-stack through
# PyPI trusted publishing.

on:
  push:
    branches: [main]
    tags: ["python-v*"]

concurrency: release-${{ github.ref }}

jobs:
  npm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # npm trusted publishing (OIDC) needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      - uses: changesets/action@v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: Version packages
          commit-message: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  pypi:
    if: startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: python/django-stack
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check the tag matches the package version
        run: |
          version=$(uv version --short)
          test "python-v${version}" = "${GITHUB_REF_NAME}"
      - run: uv build
      - run: uv publish --trusted-publishing always
