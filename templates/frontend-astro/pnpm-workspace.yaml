# pnpm's settings for the frontend (pnpm 11 and later).

# Resolve only versions published at least a day ago, so a compromised
# release is usually caught before it reaches you. DjangoStack's own
# packages are exempt, so a project made on a release day installs.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@django-stack/*"

# Which dependencies may run install scripts; pnpm refuses others.
allowBuilds: {}

# The peer ranges of @astrojs/check allow a 2.0 beta of @emnapi, which pnpm
# picks and which crashes `astro check`. Keep @emnapi on 1.x, as npm does.
overrides:
  "@emnapi/core": ^1.11.3
  "@emnapi/runtime": ^1.11.3
