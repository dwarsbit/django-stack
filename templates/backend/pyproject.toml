[project]
name = "{{project_name}}-backend"
version = "0.1.0"
description = "The Django backend of {{project_name}}."
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
    "django-stack[server,s3]>=0.15.0",
    "django-headless[schema]>=1.1.1",
    "django-content-studio[images,huey]>=1.11.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.11", "ruff>=0.15"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
filterwarnings = [
    # WhiteNoise warns that collectstatic has not run, which tests do not need.
    "ignore:No directory at:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
