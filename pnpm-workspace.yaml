packages:
  - packages/*
  - website

# Which dependencies may run install scripts. allowBuilds is the setting of
# pnpm 11 and later; onlyBuiltDependencies and ignoredBuiltDependencies say
# the same for pnpm 10. core-js only prints a message in its install script.
allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  core-js: false
onlyBuiltDependencies:
  - "@biomejs/biome"
  - esbuild
ignoredBuiltDependencies:
  - core-js

# Resolve only versions published at least a day ago, the default of
# pnpm 11 and later, so the lockfile passes their supply-chain check.
minimumReleaseAge: 1440

# Security fixes for transitive dependencies of Docusaurus (the docs
# site). Remove an entry once Docusaurus depends on a fixed version.
overrides:
  serialize-javascript: ^7.1.3
  tinypool: ^2.1.2
  uuid: ^11.1.1
